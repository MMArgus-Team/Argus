_config_version: 33

# 每次 HTTP 调用的 LLM 超时 (秒)。按 provider/model 的覆盖优先级更高。
llm_timeout_seconds: 120

# ═══════════════════════════════════════════════════════════════════════
# Argus 配置（项目内 git 跟踪的单一事实源）。
# dashboard/gateway 启动时会把本项目 config.yaml 复制到 <HERMES_HOME>/config.yaml。
# 改这里后重启生效。含明文 API key（项目约定）。
# ═══════════════════════════════════════════════════════════════════════

# fallback_model (可选): 主模型不可用时自动切换。
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

# ═══════════════════════════════════════════════════════════════════════
# MODELS — 主 agent 在 model: 顶层 (default/provider/base_url/api_key/supports_vision)。
# 各多模态子模块是并列的 4 元组 {provider, base_url, api_key, model}:
#   monitor (always-on 监控) · watcher (深研) · memory (分层记忆) · embedding · ocr
# 统一约定: base_url 空 → 跟随主 agent 的解析客户端; base_url 填 → 独立端点
# (custom/openai=OpenAI 兼容; gemini=Google generateContent, 仅 memory)。
# provider 取值清单见 hermes_cli/models.py:CANONICAL_PROVIDERS; 插件放 providers/ 自动注册。
# ═══════════════════════════════════════════════════════════════════════
model:
  # ── 主 agent ──
  # model 名须与网关精确匹配 (大小写/连字符错会 200 空返回)。
  default: "GPT-5.6 Luna"
  provider: "custom"
  base_url: ""
  api_key: ""
  supports_vision: true

  # ── MonitorAgent ──
  # MaaS 网关要求 Bearer + api-key 头同传; 凭据放 .env, 勿提交本文件。
  monitor:
    provider: "custom"
    base_url: ""
    api_key: ""
    model: "Kimi-K2.6"
    send_api_key_header: true

  # ── Watcher = 深研 worker (只出过程报告, 每轮) ──
  watcher:
    provider: "custom"
    base_url: ""
    api_key: ""
    model: "GPT-5.6 Luna"
    watch:
      min_batch: 64                # 无场景/无 ttl 时兜底目标帧数
      round_ttl_sec: 120.0         # 兜底轮 ttl (秒)
      poll_interval: 2.0           # 攒帧轮询/进度推送间隔 (秒)
      report_every_rounds: 3       # 每 N 批推一次累积报告
      # 无新场景持续 2 秒时提前用手头尾帧分析, 不等分段 TTL (只提前触发, 不直接判结束)。
      static_tail_flush_sec: 2.0
      # 当前段与召回历史图共享 48 图预算 (接口上限 50, 留协议余量)。
      request_max_images: 48
      # 疑似结束 → 无新画面 2 秒独立确认一次; 有可信结尾线索立即结束。
      completion_confirm_delay_sec: 2.0
      # 仅当 max_attempts 显式 >1 时生效: 二次门槛按候选出现后累计静止时长算。
      completion_confirm_retry_total_sec: 8.0
      # 分段模型直接 finish 明确的结束; 其他疑似结尾只确认一次, 不串行调两次视觉。
      completion_confirm_max_attempts: 1
      completion_confirm_frames: 8
      completion_confirm_min_confidence: 0.6
    react:                         # ReAct 大脑 (多轮派 search/recall)
      max_tokens: 512
      recent_frames: 8
      recent_history_turns: 16
      max_rounds: 4                # ReAct 循环硬上限
      round_max_tokens: 2048       # 收尾轮同时出 thought/tasks + 完整 answer
      search_tasks_max: 5          # 一轮并发 search 子任务上限 (成本闸)
    search:
      max_tokens: 4096
      max_tool_rounds: 3
      recent_frames: 1             # 只看 anchor 一帧 (决定调工具 / 画 bbox)
    # AnySearch (text_search 外部检索后端); key 也可走 env ANYSEARCH_API_KEY。
    anysearch:
      endpoint: "https://api.anysearch.com/mcp"
      api_key: ""
      max_results: 8               # <=10
      result_max_chars: 4000       # 单条结果注入前截断; 0/负=不截
      timeout: 30.0

  # ── Memory model (MemoryWriter/Reviewer) ──
  # base_url 空 → 跟随主 agent; "gemini" → Google generateContent 原生。
  # Writer/Recall 用 GPT-5.6 Luna; Reviewer 下方单独覆盖为 Kimi K3 (支持 50+ 图复盘)。
  memory:
    provider: "custom"
    base_url: ""
    api_key: ""
    model: "GPT-5.6 Luna"
    vision_ability: true           # 记忆抽取是视觉任务, 必须 true (否则 backend 启动即报错)
    entity_alias_threshold: 0.85   # entity 归并模糊匹配阈值
    max_failures: 10               # 连续 N 次 wake 失败 → 停 writer loop
    writer:
      wake_interval: 10.0          # 写入频率 (越大越省 token)
      max_tokens: 5000
      recent_frames: 20
      asr_window_sec: 15.0
      entity:                      # entity tier 三档分桶 (E9)
        enabled: true
        min_seen: 2
        macro_lookback: 8
        tier1_n: 5
        tier2_n: 10
        tier3_n: 15
        rep_frames_max: 5
      event_timeline:              # 历史段用 macro+micro 事件 (E10)
        enabled: true
        max_macros: 15
        max_micros: 30
    # MemoryReviewer (120s wake, macro 触发)。独立 Kimi K3, 避免 50+ 图复盘裁帧。
    reviewer:
      provider: "custom"
      # EntityReviewer 用第 1 个、EventReviewer 用第 2 个；只配一个时自动串行。
      base_urls:
        - ""
        - ""
      api_key: ""
      model: "kimi/kimi-k3"
      enabled: true
      wake_interval: 120.0
      total_frames: 60             # 复合采样: 60% 最近 + 40% 全程
      recent_ratio: 0.6
      recent_window_sec: 300.0
      min_micros: 3
      max_tokens: 3072
      max_actions_per_round: 8
      image_max_side: 512
      image_jpeg_quality: 55
      max_concurrency: 1             # 每个 URL 最多 1 个在途请求
      single_endpoint_interval_sec: 0.5  # 只配一个 URL 时两次大请求间隔
      overload_retries: 1            # 仅重试 429/EngineOverloaded/临时网关错误
      retry_backoff_sec: 2.0
      max_failures: 10
      entity_enabled: true
      event_enabled: true
      edge_enabled: false          # Edge 是 no-op 骨架, 默认关
      entity_frames: 12
      event_frames: 80             # EventReviewer 历史画面最高上限
      event_gate:                  # EventReviewer 昂贵, gate 门槛
        enabled: true
        sample_every_macros: 5
        min_micro_count: 15
        min_entity_state_changes: 80
        min_distinct_entities: 25
        min_asr_cues: 12
        min_asr_chars: 600
    # Memory-recall 子 agent (recall_mm_memory tool + 深研 recall)。
    recall:
      max_tokens: 2048
      max_rounds: 4
      topk_micro: 12
      topk_entity: 12
      distill_max_tokens: 512
      decide_frames: 6            # Recall 决策时附 N 帧提问时刻画面
      verify_enabled: true         # 末尾视觉验收, 过滤无目标噪声帧
      verify_max_frames: 10
      verify_retries: 1
      verify_retry_delay_sec: 0.5
      verify_provider: "custom"
      verify_base_url: ""
      verify_api_key: ""
      verify_model: "GPT-5.6 Luna"
      cont_frames_max: 6           # 最终给回答模型的历史真图上限
    # L2 macro / L3 super 聚合
    aggregator:
      l2_min_micro: 5              # 攒满 5 micro 触发 L2
      l2_max_duration: 180.0       # 或 3min cap
      l3_min_macro: 4              # 攒满 4 macro 触发 L3
      l3_max_duration: 900.0       # 或 15min cap
      l2_frames: 50
      l3_frames: 128
      max_tokens: 2048
      image_max_side: 512
      image_jpeg_quality: 55
    micro:                         # micro 段强制切割兜底
      max_duration: 30.0           # 段最长 30s
      max_ticks: 6                 # 或 6 拍 (=30s)
    frame_store:                   # 关键帧持久化
      max: 4000
      dedup_scan_n: 8
      ts_exact_eps: 0.3            # 同一瞬间 ts 容差 (秒)

  # ── Embedding (混合关键词+向量召回) ──
  # base_url 空 → 关闭 embedding, search_* 走纯关键词兜底。
  embedding:
    provider: "openai"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: ""
    model: "text-embedding-v3"
    dimensions: 1024               # 256/512/768/1024
    batch_size: 16
    timeout_sec: 4.0               # 超时降级到关键词
    frame:                         # 帧图像 embedding; model 空 → 关闭帧向量
      model: "tongyi-embedding-vision-plus-2026-03-06"
      base_url: ""
      api_key: ""
      dimensions: 1152             # 64~1152
      res_level: 3                 # 0/1/2/3 → 单图 127/402/578/1026 token
      timeout_sec: 6.0
    hybrid:                        # 关键词×向量 RRF
      enabled: true                # false → 只用关键词
      vector_topk: 30
      rrf_k: 60
      frame_topk: 8
      # 0 = 对全部持久化关键帧分批计算 top-k；正数仅用于紧急限制延迟。
      frame_pool_cap: 0

  # ── OCR (screen-share 文字抽取, 必开) ──
  # 仅本地 RapidOCR (rapidocr+onnxruntime 是必装依赖, 无端点/密钥)。
  # 单实例多线程: 进程共享一个引擎, 最多 max_threads 并发; 全忙 → 跳过本次识别不重试。
  # 事件驱动: 每保留 frames_between_ocr 张新帧 → 识别最新 1 帧 (无定时器, 静止画面
  # 不产生新帧 → 自然不识别)。每次识别只送 1 帧; 多次识别结果按时间戳排序。
  ocr:
    local_backend:
      backend: "rapidocr"          # 本地 OCR (无端点)
    timeout_sec: 10.0              # 单次识别超时
    max_tokens: 1200
    max_side: 1536
    max_threads: 12                # 并发识别线程上限
    frames_between_ocr: 4          # 每保留 N 张新帧识别一次 (取最新帧)

# ── Auxiliary clients ──
# vision: vision_analyze 工具 + 浏览器截图分析。
# (v33+: auxiliary.text 语音意图/口播改写端点不再列入 readiness 强制检查——
# 不配置时自动回退主 agent,属可选覆盖;示例不再列出。)
auxiliary:
  vision:
    provider: "custom"
    model: "GPT-5.6 Luna"
    base_url: ""
    api_key: ""

# ═══════════════════════════════════════════════════════════════════════
# SETTINGS — 跨模块行为旋钮 (子模块旋钮在 model.*; 语音在 audio:/interaction:)。
# ═══════════════════════════════════════════════════════════════════════
settings:
  enabled: true
  # 主 agent 不被动注入帧; 视觉问答统一走 query_multimodal → QueryWorker。
  # get_current_frame 只用于用户明确要求取回/展示最新原始帧。记忆常开 (无开关)。

  framebuffer:                     # 共享采集环 + 入口 dHash 去重
    seconds: 1800.0                # 30min 2fps 全保留 (~280MB @720p)
    capture_fps: 2.0
    dhash_threshold_init: 6
    dhash_threshold_min: 2         # 文字/会议类下限 (激进去重)
    dhash_threshold_max: 20        # 动态场景上限

  scene_probe:                     # 抽小图判场景 → 调去重阈值 + 攒帧节奏
    interval_s: 20.0
    window_s: 20.0
    frames: 3
    maxside: 256
    quality: 50
    use_llm: true                  # false → 阈值恒为 init
    timeout_s: 20.0

  conv:                            # 对话历史上限
    max_chars: 100000
    min_turns: 1
    max_bg_obs: 200

  ui_event_thumb:                  # 推给前端 UI 的缩略图
    max_side: 480
    jpeg_quality: 70

  # MemoryWriter L1 请求图 payload 压缩 (OCR/screen_text 仍可用 ocr_max_side)。
  writer_image_max_side: 1280
  writer_image_jpeg_quality: 80

  # 会话级外部检索事实缓存; 动态事实按 TTL 复验。
  search_facts_max: 64
  search_fact_ttl_sec: 3600
  search_fact_value_max_chars: 4000
  # QueryWorker 会话级并发上限。
  query_worker_max_concurrency: 2
  query_worker_max_pending: 8

# ═══════════════════════════════════════════════════════════════════════
# AUDIO — 多模态语音接口 (ASR/TTS/env-audio)。主 chat 的 tts:/stt: 是另一套。
# ═══════════════════════════════════════════════════════════════════════
audio:
  # 用户语音 ASR (mic → agent); 云 ASR 设 api_key + model, 自托管也可 multipart。
  asr_url: ""
  asr_api_key: ""
  asr_model: ""

  # 环境音 ASR (屏幕共享音频 → 音频观察)。
  # env_asr_backend: "dashscope"/"qwen" (整段一条) | "whisperx" (多 speaker)。
  # env_api_key 空 → 回退 dashscope_api_key。
  env_asr_backend: "dashscope"
  env_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  env_api_key: ""
  env_asr_model: "qwen3-asr-flash"

  # DashScope 实时语音 (流式麦 ASR + 流式 TTS)。key 空 → 两者静默禁用。
  dashscope_api_key: ""
  realtime_asr_enabled: true
  realtime_asr_model: "qwen3-asr-flash-realtime"
  # VAD: threshold 越高越不敏感; silence_ms 越大越耐停顿。
  realtime_asr_vad_threshold: 0.5
  realtime_asr_vad_silence_ms: 500
  realtime_tts_enabled: true
  realtime_tts_model: "qwen3-tts-flash-realtime"
  realtime_tts_voice: "Cherry"
  realtime_tts_speech_rate: 1.3               # 1.0=default(慢), 1.3≈自然, 上限 ~2.0
  # 环境音门槛
  env_audio_enabled: true
  env_audio_window_sec: 5.0
  env_audio_min_rms: 0.005
  env_audio_min_text_chars: 2
  env_audio_filter_fillers: true

# ═══════════════════════════════════════════════════════════════════════
# INTERACTION — VoiceAgent 交互模式 (麦+喇叭同开; UI【对话】按钮控制)。
# ★ 这批 key 保持扁平 (VoiceAgent 直接读原始 dict, 不经 flatten) — 勿嵌套。
# ═══════════════════════════════════════════════════════════════════════
interaction:
  voice_interact_ctx_convo_turns: 6       # 拟词时看最近对话轮数
  voice_interact_ctx_convo_max_chars: 1200
  voice_interact_ctx_self_recent: 2       # 自己前 N 次说过的话 (防重复)
  voice_interact_output_max_chars: 60     # 一句 TTS 上限字数
  voice_interact_llm_timeout_sec: 6       # 拟词超时 → 兜底原文播放
  voice_interact_coalesce_window_ms: 0    # 0=关闭合并
  voice_decide_min_gap_sec: 3.0           # 距上次开口 < 此值且优先级不高 → 不说
  voice_decide_recent_n: 8                # 决策层判语义重复看的历史条数
  voice_main_input_max_queue: 8           # 主 Agent 输入 FIFO 上限
  voice_filter_min_chars: 3               # 远场误识别防御 (层2 规则过滤)
  voice_filter_dedup_window_sec: 2.0      # 距上句 < 此秒且高度重复 → 丢
  voice_filter_dedup_ratio: 0.8
  voice_intent_check_enabled: true        # 层3 意图前置分类; 关闭 → 只走层2规则
  voice_intent_check_timeout_sec: 2.0     # LLM 超时 → 兜底放行
  voice_intent_context_recent_ms: 15000   # 距上次对话 < 此 ms → 大概率延续, 可跳过
  # EOU 拼接状态机 (始终开启, 无关闭开关)。
  voice_eou_remote_timeout_sec: 2.0       # 远端意图判断: 监听中超时强制 flush (秒)
  voice_eou_max_buffer_segs: 5            # 最多拼几段 (防无限拼接)
